quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:123456}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/coldwheels}

quarkus.devservices.enabled=false

# Gerenciamento do schema
%dev.quarkus.hibernate-orm.schema-management.strategy=update
%prod.quarkus.hibernate-orm.schema-management.strategy=none

# Dados de demonstração apenas em desenvolvimento
%dev.quarkus.hibernate-orm.sql-load-script=import.sql
%prod.quarkus.hibernate-orm.sql-load-script=no-file

# Logs SQL desativados por padrão para evitar exposição de dados pessoais
%dev.quarkus.hibernate-orm.log.sql=false
%dev.quarkus.hibernate-orm.log.bind-parameters=false

quarkus.http.port=8080

# CORS para o Angular
quarkus.http.cors.enabled=true

quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS,HEAD
quarkus.http.cors.access-control-allow-credentials=false

# Object Storage S3 (RustFS local ou VM na Azure / AWS S3)
coldwheels.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
coldwheels.s3.region=${S3_REGION:us-east-1}
coldwheels.s3.access-key=${S3_ACCESS_KEY:rustfsadmin}
coldwheels.s3.secret-key=${S3_SECRET_KEY:rustfsadmin}
coldwheels.s3.bucket=${S3_BUCKET:coldwheels-imagens}

# Validação de upload (5 MB padrão)
coldwheels.upload.max-size-bytes=${UPLOAD_MAX_SIZE_BYTES:5242880}
quarkus.http.limits.max-body-size=6M