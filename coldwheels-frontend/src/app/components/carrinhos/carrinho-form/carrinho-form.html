<mat-toolbar color="primary" class="toolbar">
    <span>{{ form.value.id ? 'Editar Carrinho' : 'Novo Carrinho ColdWheels' }}</span>
</mat-toolbar>

<div class="container">
    <mat-card class="form-card">
        <mat-card-content>
            <form [formGroup]="form" class="form-grid">

                <!-- Nome do Carrinho -->
                <mat-form-field appearance="outline" class="col-12">
                    <mat-label>Nome do Carrinho / Modelo</mat-label>
                    <input matInput formControlName="nome" placeholder="Ex: Bone Shaker" />
                    <mat-icon matSuffix>toys</mat-icon>
                </mat-form-field>

                <!-- Descrição -->
                <mat-form-field appearance="outline" class="col-12">
                    <mat-label>Descrição</mat-label>
                    <textarea matInput formControlName="descricao" rows="2"
                        placeholder="Detalhes da miniatura, série especial, etc."></textarea>
                </mat-form-field>

                <!-- Escala -->
                <mat-form-field appearance="outline" class="col-6">
                    <mat-label>Escala</mat-label>
                    <input matInput formControlName="escala" placeholder="Ex: 1:64" />
                </mat-form-field>

                <!-- Ano de Lançamento -->
                <mat-form-field appearance="outline" class="col-6">
                    <mat-label>Ano de Lançamento</mat-label>
                    <input matInput type="number" formControlName="anoLancamento" placeholder="Ex: 2024" />
                </mat-form-field>

                <!-- Cor -->
                <mat-form-field appearance="outline" class="col-4">
                    <mat-label>Cor</mat-label>
                    <input matInput formControlName="cor" placeholder="Ex: Vermelho Metálico" />
                    <mat-icon matSuffix>palette</mat-icon>
                </mat-form-field>

                <!-- Preço -->
                <mat-form-field appearance="outline" class="col-4">
                    <mat-label>Preço (R$)</mat-label>
                    <input matInput type="number" step="0.01" formControlName="preco" placeholder="Ex: 29.90" />
                    <span matPrefix>R$&nbsp;</span>
                </mat-form-field>

                <!-- Estoque -->
                <mat-form-field appearance="outline" class="col-4">
                    <mat-label>Estoque (unidades)</mat-label>
                    <input matInput type="number" formControlName="estoque" placeholder="Ex: 15" />
                    <mat-icon matSuffix>inventory_2</mat-icon>
                </mat-form-field>

                <!-- Barra de Ações (Botões) -->
                <div class="actions col-12">
                    <!-- Botão Excluir (só aparece se estiver editando) -->
                    @if (form.value.id) {
                    <button mat-flat-button color="warn" type="button" (click)="excluir()">
                        <mat-icon>delete</mat-icon> Excluir
                    </button>
                    }

                    <span class="spacer"></span>

                    <button mat-stroked-button type="button" (click)="voltar()">
                        <mat-icon>arrow_back</mat-icon> Cancelar
                    </button>

                    <button mat-flat-button color="primary" type="button" (click)="salvar()" [disabled]="form.invalid">
                        <mat-icon>save</mat-icon> Salvar Carrinho
                    </button>
                </div>

            </form>
        </mat-card-content>
    </mat-card>
</div>
